    <path d="M64 16 C 80 12, 94 20, 88 30 C 84 37, 74 39, 68 39" stroke-width="2.2"/>
    <path d="M68 39 C 86 40, 96 50, 88 60 C 81 68, 68 68, 60 64" stroke-width="2.2"/>
