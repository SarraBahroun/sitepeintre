<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 104" width="360" height="288">
  <defs><linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
     <stop offset="0%" stop-color="#f3d49a"/><stop offset="100%" stop-color="#e6b864"/>
   </linearGradient></defs>
  <g fill="none" stroke="url(#s)" stroke-linecap="round" stroke-linejoin="round">
    <!-- hampe gauche du H, terminée par une boucle -->
